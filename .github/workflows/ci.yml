name: Desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Desktop smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Desktop smoke (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ runner.os }}
          path: |
            test-results/
            ref/flows/
          if-no-files-found: ignore
      - name: Packaged Pi runtime (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Packaged Pi runtime (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-diagnostics-${{ runner.os }}
          path: |
            test-results/
            ref/flows/
          if-no-files-found: ignore
