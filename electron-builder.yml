appId: com.example.edu-harness
productName: Learning Studio
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
npmRebuild: false
extraResources:
  - from: assets/branding/icon.png
    to: branding/icon.png
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  icon: assets/branding/icon.ico
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: assets/branding/icon.icns
  target: dmg
  category: public.app-category.education
linux:
  icon: assets/branding/icon-512.png
  target: AppImage
  category: Education
  syncDesktopName: true
